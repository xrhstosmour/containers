# Serves the site behind Traefik, which terminates TLS.
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;
    # Redirects such as `/privacy` to `/privacy/` keep the public host and
    # scheme, not this container's port.
    absolute_redirect off;

    # Scripts, styles, images and fonts from the site itself only. Inline
    # styles are allowed for `style` attributes, inline scripts are not.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # `expires` rather than `add_header`, which would drop the headers above.
    location /assets/ {
        expires 7d;
    }
}
