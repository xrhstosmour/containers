networks:
  internal:
    name: "internal"
    # External means the container will be accessible from other containers in the same local network.
    # If you want to isolate the container create a new network, with different name for each container and without being external.
    external: true

volumes:
  flower:
    name: "flower"

services:
  flower:
    image: "mher/flower:2.0.1"
    container_name: "flower"
    restart: "unless-stopped"
    command:
      - "sh"
      - "-c"
      - |
        until nc -z -w 3 "${RABBITMQ_HOST?Variable not set}" "${RABBITMQ_PORT?Variable not set}"; do
          echo "Waiting for RabbitMQ at ${RABBITMQ_HOST?Variable not set}:${RABBITMQ_PORT?Variable not set}...";
          sleep 2;
        done
        exec celery flower
    networks:
      - "internal"
    ports:
      - "${FLOWER_PORT?Variable not set}:${FLOWER_PORT?Variable not set}"
    environment:
      - "CELERY_BROKER_URL=amqps://${RABBITMQ_USER?Variable not set}:${RABBITMQ_PASSWORD?Variable not set}@${RABBITMQ_HOST?Variable not set}:${RABBITMQ_PORT?Variable not set}//"
      - "FLOWER_PORT=${FLOWER_PORT?Variable not set}"
      - "FLOWER_BASIC_AUTH=${FLOWER_USER?Variable not set}:${FLOWER_PASSWORD?Variable not set}"
      - "SSL_CERT_FILE=/etc/flower/certificates/ca_certificate.pem"
    volumes:
      # Copy RabbitMQ's real ca_certificate.pem here so Flower trusts it for amqps://, see certificates/template.ca_certificate.pem.
      - "./certificates:/etc/flower/certificates:ro"
      - "flower:/data"
    labels:
      - "traefik.enable=false"
