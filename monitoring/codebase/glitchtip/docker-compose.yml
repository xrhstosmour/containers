networks:
  internal:
    name: "internal"
    # External means the container will be accessible from other containers in the same network.
    # If you want to isolate the container create a new network, with different name for each container and without being external.
    external: true

services:
  # One container runs the web server and the background worker (`all_in_one`), instead
  # of a separate web and `celery` worker pair. Measured idle: about 200 MiB, against
  # about 1.2 GiB for the two `v4.0` containers. This trades process isolation for
  # memory, a task burst now shares the process that answers the healthcheck.
  glitchtip:
    # An existing `v4` database must first be migrated by a `5.x` image, GlitchTip does
    # not support going from `4.x` straight to `6.x`. Take a `pg_dump` before that.
    image: "glitchtip/glitchtip:6.2.6"
    container_name: "glitchtip"
    restart: "unless-stopped"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          # Matches the 512 MB the GlitchTip documentation recommends.
          memory: "512M"
    # `postgresql` and `redis` live in separate docker compose projects, so
    # they cannot be referenced via `depends_on`. Wait for them by hand
    # instead, matching the pattern used in `distribute/scheduler/redbeat`.
    # Redis is waited on at the address inside `REDIS_URL`, the one GlitchTip connects to.
    # `REDIS_HOST` is not used, a project often sets it for code running on the host,
    # where it is `localhost`, which this container can never reach.
    # Database migrations run automatically on startup since GlitchTip 6.
    command:
      - "bash"
      - "-c"
      - >
        until (echo > /dev/tcp/${POSTGRESQL_HOST?Variable not set}/${POSTGRESQL_PORT?Variable not set}) 2>/dev/null; do
          echo "Waiting for postgresql...";
          sleep 2;
        done &&
        until python3 -c "import os, socket, urllib.parse; url = urllib.parse.urlparse(os.environ['REDIS_URL']); socket.create_connection((url.hostname, url.port or 6379), 2).close()" 2>/dev/null; do
          echo "Waiting for redis...";
          sleep 2;
        done &&
        ./bin/start.sh
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python3 -c \"import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/_health/').status == 200 else 1)\""
      interval: "10s"
      timeout: "5s"
      retries: 5
      start_period: "30s"
    networks:
      - "internal"
    ports:
      # Loopback-only, for local/tunnelled admin access, like `databases/postgresql`.
      - "127.0.0.1:${GLITCHTIP_PORT?Variable not set}:8000"
    environment:
      - "SERVER_ROLE=all_in_one"
      # The recycle limit applies per web worker, so keep one worker and half of the memory
      # limit. GlitchTip defaults to no less than 1024 MiB, which is above the limit, so
      # the worker would be killed by the kernel before it is ever recycled.
      - "GRANIAN_WORKERS=1"
      - "GRANIAN_WORKERS_MAX_RSS=256"
      - "SECRET_KEY=${SECRET_KEY?Variable not set}"
      - "DATABASE_URL=${DATABASE_URL?Variable not set}"
      - "REDIS_URL=${REDIS_URL?Variable not set}"
      - "ENABLE_USER_REGISTRATION=${ENABLE_USER_REGISTRATION?Variable not set}"
      - "DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL?Variable not set}"
      # Without `EMAIL_URL` alert and password reset emails never leave the container, and
      # without `GLITCHTIP_DOMAIN` the DSNs and links in the interface use the wrong host.
      - "EMAIL_URL=${EMAIL_URL?Variable not set}"
      - "GLITCHTIP_DOMAIN=${GLITCHTIP_DOMAIN?Variable not set}"
    labels:
      - "traefik.enable=false"
