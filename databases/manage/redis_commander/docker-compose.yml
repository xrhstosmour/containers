# TODO: Use Secrets to store the passwords to all containers.
# TODO: Implement Traefik labels for reverse proxy, even in local network.
networks:
  internal:
    name: "internal"
    # External means the container will be accessible from other containers in the same local network.
    # If you want to isolate the container create a new network, with different name for each container and without being external.
    external: true

services:
  redis-commander:
    image: "ghcr.io/joeferner/redis-commander:0.8.0"
    container_name: "redis-commander"
    restart: "unless-stopped"
    # `redis` lives in a separate compose project (`databases/redis`), so
    # `depends_on` cannot reference it. Wait for the host:port to be
    # reachable before starting instead.
    command:
      [
        "sh",
        "-c",
        "until nc -z redis ${REDIS_PORT?Variable not set}; do echo 'Waiting for Redis...'; sleep 1; done; exec /redis-commander/docker/entrypoint.sh",
      ]
    networks:
      - "internal"
    ports:
      - "${REDIS_COMMANDER_PORT?Variable not set}:8081"
    environment:
      - "HTTP_USER=${REDIS_COMMANDER_USER?Variable not set}"
      - "HTTP_PASSWORD=${REDIS_COMMANDER_PASSWORD?Variable not set}"
      # REDIS_HOSTS embeds host, port, db, and password in one string,
      # avoiding CLI parsing issues when the password starts with `-`.
      - "REDIS_HOSTS=default:redis:${REDIS_PORT?Variable not set}:0:${REDIS_PASSWORD?Variable not set}"
    labels:
      - "traefik.enable=false"
