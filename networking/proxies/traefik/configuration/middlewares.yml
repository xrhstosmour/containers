http:
  middlewares:
    # Basic authentication middleware.
    basic_authentication_middleware:
      basicAuth:
        usersFile: "/run/secrets/htpasswd"
        realm: "Proxy Basic Authentication"

    # Rate limit middleware, used by the basic authentication chain in front of
    # the Traefik dashboard. A page load fires a few dozen requests at once,
    # which the burst absorbs, the average is what a person can keep up. IPv6
    # clients are counted per /64, the block a subscriber holds, not per
    # address. Requires Traefik v3.1 or later.
    rate_limit_middleware:
      rateLimit:
        average: 20
        burst: 50
        sourceCriterion:
          ipStrategy:
            ipv6Subnet: 64

    # HTTPS redirect middleware.
    https_redirect_middleware:
      redirectScheme:
        scheme: "https"
        permanent: true

    # Security headers middleware.
    security_headers_middleware:
      headers:
        accessControlAllowMethods:
          - "GET"
          - "PUT"
          - "POST"
          - "PATCH"
          - "DELETE"
          - "OPTIONS"
        accessControlMaxAge: 86400
        hostsProxyHeaders:
          - "X-Forwarded-Host"
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        frameDeny: true
        contentSecurityPolicy: "script-src 'self'"
        addVaryheader: true
        # https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Frame-Options
        customFrameOptionsValue: "SAMEORIGIN"
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "same-origin"
        # referrerPolicy: "origin-when-cross-origin"
        permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=(), usb=(), vr=(), vibrate=(self), midi=(self), notifications=(self), push=(self)"
        customResponseHeaders:
          X-Permitted-Cross-Domain-Policies: none
          # expect-ct: "max-age=604800, report-uri='https://oak.ct.letsencrypt.org/2021'"
          # Disable search engines from indexing home server
          X-Robots-Tag: "none,noarchive,nosnippet,notranslate,noimageindex,"
          # Hide server info from visitors.
          server: ""
          x-powered-by: ""

    # Compress middleware.
    compress_middleware:
      compress: {}

    # Buffering middleware.
    # https://stackoverflow.com/questions/49717670/how-to-config-upload-body-size-restriction-in-traefik
    buffering_middleware:
      buffering:
        maxResponseBodyBytes: 2000000
        maxRequestBodyBytes: 10485760
        memRequestBodyBytes: 2097152
        memResponseBodyBytes: 2097152
        retryExpression: "IsNetworkError() && Attempts() <= 2"
