# Coturn TURN server configuration for NetBird's relay/NAT-traversal needs.
# This file is mounted read-only; on every container start (see
# `docker-compose.yml`) it's rendered into a container-local copy with the
# TURN password below substituted from NETBIRD_TURN_PASSWORD in `.env`, so
# this tracked copy is never modified.
# Trimmed down from upstream's full `infrastructure_files/turnserver.conf.tmpl`
# (itself the stock `coturn` reference config) to only the directives this
# setup actually uses. Edit the rest of this file directly for anything else,
# the same way Traefik's `configuration/*.yml` files are hand-edited.
#
# TODO: Enable TLS (`cert`/`pkey` below) once real certificates are available,
# the same way Traefik's ACME block is left commented until then.

listening-port=3478
# TODO: Uncomment once certificates are in place.
# tls-listening-port=5349

min-port=49152
max-port=65535

fingerprint
lt-cred-mech
user=netbird:${NETBIRD_TURN_PASSWORD}

realm=netbird.selfhosted

# cert=/etc/coturn/certs/cert.pem
# pkey=/etc/coturn/private/privkey.pem

log-file=stdout
no-cli
no-software-attribute
pidfile="/var/tmp/turnserver.pid"
