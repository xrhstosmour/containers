# More help:
# https://github.com/vaggeliskls/windows-in-docker-container
# https://dev.to/vaggeliskls/windows-vm-inside-a-linux-docker-container-54ol
networks:
  internal:
    name: "internal"
    # External means the container will be accessible from other containers in the same network.
    # If you want to isolate the container create a new network, with different name for each container and without being external.
    external: true

volumes:
  libvirt_data:
    name: "libvirt_data"
  vagrant_data:
    name: "vagrant_data"
  vagrant_project:
    name: "vagrant_project"
  libvirt_config:
    name: "libvirt_config"

services:
  windows10:
    # Pinned to the latest stable release tag as of writing, check
    # https://github.com/vaggeliskls/windows-in-docker-container/tags for a newer one before deploying.
    image: "ghcr.io/vaggeliskls/windows-in-docker-container:1.0.1"
    stdin_open: true
    tty: true
    privileged: true
    cgroup: host
    networks:
      - "internal"
    volumes:
      - "libvirt_data:/var/lib/libvirt"
      - "vagrant_data:/root/.vagrant.d"
      - "vagrant_project:/app/.vagrant"
      - "libvirt_config:/etc/libvirt"
    devices:
      - "/dev/kvm"
      - "/dev/net/tun"
    ports:
      - "${REMOTE_CONNECTION_PORT?Variable not set}:${REMOTE_CONNECTION_PORT?Variable not set}"
    environment:
      - "MEMORY=${MEMORY?Variable not set}"
      - "CPU=${CPU?Variable not set}"
      - "DISK_SIZE=${DISK_SIZE?Variable not set}"
    labels:
      - "traefik.enable=false"
