networks:
  internal:
    name: "internal"
    # External means the container will be accessible from other containers in the same network.
    # If you want to isolate the container create a new network, with different name for each container and without being external.
    external: true

volumes:
  hashicorp_logs:
    name: "hashicorp_logs"
  hashicorp_file:
    name: "hashicorp_file"

services:
  hashicorp:
    image: "hashicorp/vault:1.18"
    container_name: "hashicorp"
    restart: "unless-stopped"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
    networks:
      - "internal"
    cap_add:
      - "IPC_LOCK"
    ports:
      # The container always listens on 8200, see `template.hcl`, only the host side is configurable.
      - "${HASHICORP_PORT?Variable not set}:8200"
    volumes:
      - "./template.hcl:/vault/config/config.hcl:ro"
      - "./certificates:/vault/certificates:ro"
      - "hashicorp_logs:/vault/logs"
      - "hashicorp_file:/vault/file"
    environment:
      - "VAULT_ADDR=https://0.0.0.0:8200"
    command: "server -config=/vault/config/config.hcl"
    labels:
      - "traefik.enable=false"
